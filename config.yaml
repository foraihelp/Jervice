# Jarvis configuration
# Restart the app after changing this file.

wake_word:
  # openWakeWord ships pretrained models including "hey_jarvis".
  # See jarvis/audio/wake_word.py for how this is loaded.
  model: "hey_jarvis"
  threshold: 0.5          # 0.0-1.0, lower = more sensitive (more false triggers)

recording:
  silence_seconds: 1.2    # how long you must pause before recording stops
  max_seconds: 20         # hard cap on a single command recording
  sample_rate: 16000
  # RMS amplitude a frame must exceed to count as "speech" (plain int16
  # loudness, roughly 0-32768). Idle mic/room noise is usually ~50-300;
  # normal speech is usually 1000+. Lower this if Jarvis cuts you off too
  # early; raise it if it keeps recording through background noise.
  silence_rms_threshold: 400
  # Microphone to record from: a substring of its name (e.g. "Microphone" for
  # the PC's own mic), or blank for the Windows default. Tip: with a
  # Bluetooth headset, using the PC/USB mic here and the headset for output
  # only keeps the headset in stereo quality -- Windows drops it to a
  # low-quality mono "call" mode whenever the headset's own mic is in use.
  # Easiest to set from Settings (gear icon).
  input_device: ""

stt:
  # faster-whisper model size: tiny, base, small, medium, large-v3
  # Bigger = more accurate but slower and more RAM. "small" is a good
  # balance on a typical laptop CPU.
  model_size: "small"
  device: "cpu"            # set to "cuda" if you have an NVIDIA GPU + CUDA installed
  compute_type: "int8"     # int8 is fast on CPU; use "float16" on GPU

tts:
  rate: 185                 # words per minute, pyttsx3 default is ~200
  volume: 1.0
  # Leave blank to use the system default voice. To list available voices,
  # run: python -m jarvis.audio.tts --list-voices
  voice_id: ""
  # Who speaks: "auto" = Windows voices, plus Microsoft's online neural
  # voices (via edge-tts, needs internet, no key) for Hindi/Bengali replies
  # since Windows doesn't ship those voices; "sapi" = Windows voices only,
  # fully offline; "edge" = online neural voices for everything.
  engine: "auto"
  # Pins Jarvis's own speech to a specific playback device, independent of
  # whatever Windows currently considers the "default" output -- useful
  # because a paired-but-disconnected Bluetooth headset can stay the
  # Windows default, silently swallowing all TTS. Leave blank to just use
  # the system default. Set to a substring of a device name (e.g. "Realtek"
  # or "BenQ") -- easiest to set from the app's own Settings window
  # (gear icon), which lists your actual available devices.
  output_device: ""

brain:
  # "anthropic" (Claude) or "openai" (OpenAI itself, or ANY OpenAI-compatible
  # endpoint -- Groq, Together, OpenRouter, DeepSeek, Azure OpenAI, a local
  # Ollama/LM Studio server, etc. -- via base_url below). Easiest to change
  # from the app's own Settings window (gear icon) rather than editing this
  # file directly -- it keeps model/base_url/API key in sync for you.
  provider: "anthropic"
  # For provider "anthropic": an Anthropic model, e.g. "claude-opus-4-5-20251101".
  # For provider "openai": an OpenAI (or compatible) model, e.g. "gpt-4o".
  model: "claude-opus-4-5-20251101"
  # Only used when provider is "openai". Leave blank for api.openai.com.
  # Set to another OpenAI-compatible endpoint's URL to use that instead,
  # e.g. "https://api.groq.com/openai/v1" or "http://localhost:11434/v1"
  # for a local Ollama server.
  base_url: ""
  max_tokens: 1024
  # "" = reply in whatever language the user spoke/typed in (default).
  # "english" / "hindi" / "bengali" = always reply in that language,
  # regardless of input language -- the model translates as part of
  # answering, no separate translation step. Easiest to set from Settings
  # (gear icon), which also warns if this PC has no installed voice that
  # can actually speak the chosen language (see tts.output_device above --
  # Windows doesn't ship Hindi/Bengali voices by default).
  reply_language: ""
  # Short system prompt personality. Edit freely.
  system_prompt: >
    You are Jarvis, a concise, capable personal assistant running locally on
    the user's Windows PC. You have tools to open/close applications, manage
    windows, control system volume and screen brightness, take screenshots,
    check system status (CPU/RAM/disk/battery), search/open files, look
    things up (a quick web search or Wikipedia summary), check an
    approximate current location, and open URLs in the browser. Prefer
    taking action via tools over describing what the user could do. For any
    question or lookup (weather, facts, current events, "who/what is X"),
    always answer using web_search or wikipedia_lookup and speak the answer
    back -- only use open_url when the user explicitly asks you to open a
    specific site or link, never as a substitute for answering a question.
    This PC has no real GPS -- get_current_location is IP-based and only
    approximate (city level), so say so if asked, and use it as a starting
    point (e.g. for a local-weather web_search) rather than presenting it as
    precise. Keep spoken replies short (1-3 sentences) since they will be
    read aloud via text-to-speech -- avoid long lists, code blocks, or
    markdown in your replies.

memory:
  # Number of most recent conversation turns kept in context.
  history_turns: 20
  file: "data/memory.json"

server:
  # Enables the local HTTP API (jarvis/server.py) so the iOS app (or any
  # other device on your Tailscale network) can talk to this same assistant.
  # See README.md "iOS app" section for full setup, including Tailscale.
  enabled: true
  host: "0.0.0.0"   # listen on all interfaces so Tailscale/LAN clients can reach it
  port: 8731

logging:
  level: "INFO"
  file: "data/jarvis.log"
