<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Jarvis</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: 'Sora', system-ui, -apple-system, sans-serif;
    color: #E8EEF4;
    background: #05070b;
  }
  a { color: #6FE3FF; text-decoration: none; }
  a:hover { color: #9CEEFF; }
  ::selection { background: rgba(111,227,255,0.28); }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(120,190,255,0.18); border-radius: 4px; }

  .drag { -webkit-app-region: drag; }
  .no-drag { -webkit-app-region: no-drag; }

  @keyframes jv-pulse { 0%, 100% { opacity: 0.55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.06); } }
  @keyframes jv-spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes jv-bar { 0%, 100% { height: 4px; } 50% { height: 15px; } }
  @keyframes jv-bar-active { 0%, 100% { height: 5px; } 50% { height: 20px; } }

  .icon-btn { opacity: 0.55; cursor: pointer; transition: opacity 0.15s ease; }
  .icon-btn:hover { opacity: 1; }

  #update-pill:hover { filter: brightness(1.15); }
  #update-pill.accent { border-color: rgba(111,227,255,0.4); color: #6FE3FF; background: rgba(111,227,255,0.1); }
  #update-pill.success { border-color: rgba(90,214,150,0.4); color: #5AD696; background: rgba(90,214,150,0.1); }
  #update-pill.error { border-color: rgba(227,107,107,0.4); color: #E36B6B; background: rgba(227,107,107,0.1); }
  .update-spinner { width: 9px; height: 9px; border-radius: 50%; border: 1.6px solid currentColor; border-top-color: transparent; animation: jv-spin-slow 0.7s linear infinite; flex-shrink: 0; display: inline-block; }

  #command-input {
    background: transparent; border: none; outline: none; color: #EAF6FC;
    font-family: 'Sora', sans-serif; font-size: 13px; width: 100%;
  }
  #command-input::placeholder { color: #4A5A6A; }
</style>
</head>
<body>

<div style="width:100%; height:100%; display:flex; flex-direction:column; position:relative;">

  <div style="position:absolute; inset:0; pointer-events:none; background: radial-gradient(480px 320px at 85% -10%, rgba(79,166,255,0.10), transparent 60%), radial-gradient(420px 300px at -5% 110%, rgba(79,166,255,0.06), transparent 60%);"></div>

  <!-- title bar (draggable) -->
  <div class="drag pywebview-drag-region" style="position:relative; height:52px; min-height:52px; display:flex; align-items:center; justify-content:space-between; padding:0 18px; border-bottom:1px solid rgba(120,190,255,0.12);">
    <div style="display:flex; align-items:center; gap:10px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="9.5" stroke="oklch(78% 0.14 200)" stroke-width="1.4" stroke-dasharray="3 4"/>
        <circle cx="12" cy="12" r="5.5" stroke="oklch(78% 0.14 200)" stroke-width="1.4"/>
        <circle cx="12" cy="12" r="2" fill="oklch(78% 0.14 200)"/>
      </svg>
      <div style="font-size:13px; font-weight:600; letter-spacing:0.14em;">JARVIS</div>
      <div id="app-version" style="font-family:'JetBrains Mono',monospace; font-size:10.5px; font-weight:600; letter-spacing:0.02em; color:#8CA0B3; background:rgba(120,190,255,0.08); border:1px solid rgba(120,190,255,0.18); border-radius:999px; padding:2px 9px;"></div>
      <div style="display:flex; align-items:center; gap:6px; margin-left:2px; padding:4px 10px; border:1px solid rgba(120,190,255,0.22); border-radius:20px;">
        <div id="online-dot" style="width:6px; height:6px; border-radius:50%; background:oklch(78% 0.14 200); box-shadow:0 0 8px oklch(78% 0.14 200); animation:jv-pulse 2.4s ease-in-out infinite;"></div>
        <div id="online-label" style="font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:0.08em; color:#8CA0B3;">ONLINE &middot; LOCAL</div>
      </div>
    </div>
    <div class="no-drag" style="display:flex; align-items:center; gap:16px;">
      <div id="update-pill" class="no-drag" style="display:none; align-items:center; gap:7px; padding:5px 12px; border-radius:999px; font-size:11.5px; font-weight:500; background:rgba(120,190,255,0.08); border:1px solid rgba(120,190,255,0.18); color:#8CA0B3; white-space:nowrap; cursor:pointer;"></div>
      <svg id="minimize-btn" class="icon-btn" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 12h14" stroke="#8CA0B3" stroke-width="1.6" stroke-linecap="round"/></svg>
      <svg id="hide-btn" class="icon-btn" width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="#8CA0B3" stroke-width="1.6" stroke-linecap="round"/></svg>
    </div>
  </div>

  <!-- body -->
  <div style="position:relative; flex:1; display:flex; min-height:0;">

    <!-- sidebar -->
    <nav style="width:64px; min-width:64px; display:flex; flex-direction:column; align-items:center; gap:22px; padding:20px 0; border-right:1px solid rgba(120,190,255,0.10);">
      <div style="width:38px; height:38px; border-radius:9px; background:rgba(111,227,255,0.10); border:1px solid rgba(111,227,255,0.35); display:flex; align-items:center; justify-content:center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 15c2-6 5-9 8-9s6 3 8 9" stroke="#6FE3FF" stroke-width="1.6" stroke-linecap="round"/><path d="M4 18c2-5 5-7.5 8-7.5s6 2.5 8 7.5" stroke="#6FE3FF" stroke-width="1.6" stroke-linecap="round" opacity="0.5"/></svg>
      </div>
      <div style="flex:1;"></div>
      <svg id="settings-btn" class="icon-btn" width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="2.6" stroke="#8CA0B3" stroke-width="1.5"/><path d="M12 3.5v2.4M12 18.1v2.4M20.5 12h-2.4M5.9 12H3.5M17.7 6.3l-1.7 1.7M8 16l-1.7 1.7M17.7 17.7L16 16M8 8L6.3 6.3" stroke="#8CA0B3" stroke-width="1.5" stroke-linecap="round"/></svg>
    </nav>

    <!-- chat column -->
    <main style="flex:1; min-width:0; display:flex; flex-direction:column;">

      <div style="display:flex; align-items:center; gap:18px; padding:14px 22px; border-bottom:1px solid rgba(120,190,255,0.08);">
        <div style="display:flex; align-items:center; gap:7px;">
          <div id="mic-bars" style="display:flex; align-items:flex-end; gap:2px; height:16px;">
            <div style="width:3px; background:oklch(78% 0.14 200); border-radius:2px; animation:jv-bar 1.1s ease-in-out infinite; animation-delay:0s;"></div>
            <div style="width:3px; background:oklch(78% 0.14 200); border-radius:2px; animation:jv-bar 1.1s ease-in-out infinite; animation-delay:0.15s;"></div>
            <div style="width:3px; background:oklch(78% 0.14 200); border-radius:2px; animation:jv-bar 1.1s ease-in-out infinite; animation-delay:0.3s;"></div>
            <div style="width:3px; background:oklch(78% 0.14 200); border-radius:2px; animation:jv-bar 1.1s ease-in-out infinite; animation-delay:0.45s;"></div>
          </div>
          <div id="mic-label" style="font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:0.08em; color:#8CA0B3;">MIC ARMED</div>
        </div>
        <div style="width:1px; height:14px; background:rgba(120,190,255,0.14);"></div>
        <div id="status-line" style="font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:0.08em; color:#56677A;">WAKE WORD &middot; HEY JARVIS</div>
        <div style="flex:1;"></div>
        <div id="model-label" style="font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:0.08em; color:#56677A;">&nbsp;</div>
      </div>

      <div id="transcript" style="flex:1; overflow-y:auto; padding:22px 26px; display:flex; flex-direction:column; gap:18px;"></div>

      <!-- typed command row -->
      <div style="padding:0 22px;">
        <div style="display:flex; align-items:center; gap:10px; background:#0A0F16; border:1px solid rgba(120,190,255,0.14); border-radius:10px; padding:9px 14px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="opacity:0.5; flex-shrink:0;"><path d="M4 12h11M11 6l6 6-6 6" stroke="#6FE3FF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <input id="command-input" type="text" placeholder="Type a command, or hold the mic to talk&hellip;">
        </div>
      </div>

      <!-- composer / orb bar -->
      <div style="display:flex; align-items:center; justify-content:center; gap:26px; padding:16px 22px 24px;">
        <svg id="mute-btn" class="icon-btn" width="20" height="20" viewBox="0 0 24 24" fill="none"><path id="mute-icon-mic" d="M12 3a3 3 0 013 3v6a3 3 0 01-6 0V6a3 3 0 013-3z" stroke="#8CA0B3" stroke-width="1.5"/><path d="M6 11a6 6 0 0012 0M12 17v3" stroke="#8CA0B3" stroke-width="1.5" stroke-linecap="round"/><path id="mute-slash" d="M18.5 5.5l-13 13" stroke="#E36B6B" stroke-width="1.5" stroke-linecap="round" style="display:none;"/></svg>

        <div id="orb" class="no-drag" style="position:relative; width:78px; height:78px; display:flex; align-items:center; justify-content:center; cursor:pointer;">
          <div style="position:absolute; inset:0; border-radius:50%; border:1px dashed rgba(111,227,255,0.35); animation:jv-spin-slow 14s linear infinite;"></div>
          <div id="orb-core" style="position:absolute; width:58px; height:58px; border-radius:50%; background:radial-gradient(circle at 35% 30%, rgba(180,240,255,0.9), rgba(79,166,255,0.35) 55%, rgba(79,166,255,0.05) 75%); box-shadow:0 0 28px rgba(111,227,255,0.45); transition:box-shadow 0.2s ease;"></div>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" style="position:relative;"><path d="M12 3a3 3 0 013 3v6a3 3 0 01-6 0V6a3 3 0 013-3z" stroke="#04141C" stroke-width="1.8"/><path d="M6 11a6 6 0 0012 0M12 17v3" stroke="#04141C" stroke-width="1.8" stroke-linecap="round"/></svg>
        </div>

        <svg id="stop-btn" class="icon-btn no-drag" width="20" height="20" viewBox="0 0 24 24" fill="none"><title>Stop speaking (Esc)</title><circle cx="12" cy="12" r="9" stroke="#E36B6B" stroke-width="1.5"/><rect x="8.5" y="8.5" width="7" height="7" rx="1" fill="#E36B6B"/></svg>

        <svg id="quit-btn" class="icon-btn" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 3v10M6 13a6 6 0 0012 0" stroke="#8CA0B3" stroke-width="1.5" stroke-linecap="round"/></svg>
      </div>
    </main>

    <!-- telemetry -->
    <aside style="width:236px; min-width:236px; border-left:1px solid rgba(120,190,255,0.10); padding:18px 16px; display:flex; flex-direction:column; gap:20px; overflow-y:auto;">

      <div>
        <div style="font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:0.14em; color:#56677A; margin-bottom:10px;">STATUS</div>
        <div style="display:flex; flex-direction:column; gap:8px;">
          <div style="display:flex; justify-content:space-between; font-size:12px;"><span style="color:#8CA0B3;">Wake word</span><span id="tel-wakeword" style="color:#6FE3FF; font-family:'JetBrains Mono',monospace;">ARMED</span></div>
          <div style="display:flex; justify-content:space-between; font-size:12px;"><span style="color:#8CA0B3;">Microphone</span><span id="tel-mic" style="color:#6FE3FF; font-family:'JetBrains Mono',monospace;">ACTIVE</span></div>
          <div style="display:flex; justify-content:space-between; font-size:12px;"><span style="color:#8CA0B3;">Model</span><span id="tel-model" style="color:#D7E2EA; font-family:'JetBrains Mono',monospace; font-size:11px;">&nbsp;</span></div>
        </div>
      </div>

      <div style="height:1px; background:rgba(120,190,255,0.10);"></div>

      <div>
        <div style="font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:0.14em; color:#56677A; margin-bottom:10px;">CONNECTIONS</div>
        <div id="tel-connections" style="display:flex; flex-direction:column; gap:10px;"></div>
      </div>

      <div style="height:1px; background:rgba(120,190,255,0.10);"></div>

      <div>
        <div style="font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:0.14em; color:#56677A; margin-bottom:10px;">RECENT TOOLS</div>
        <div id="tel-tools" style="display:flex; flex-direction:column; gap:7px; font-family:'JetBrains Mono',monospace; font-size:10.5px; color:#5E9BB8;"></div>
      </div>

      <div style="flex:1;"></div>
      <div style="display:flex; align-items:center; gap:8px; opacity:0.7;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.5" stroke="#56677A" stroke-width="1.4"/><path d="M12 8v5l3 1.6" stroke="#56677A" stroke-width="1.4" stroke-linecap="round"/></svg>
        <span id="tel-uptime" style="font-family:'JetBrains Mono',monospace; font-size:10px; color:#56677A;">UPTIME 00:00:00</span>
      </div>
    </aside>
  </div>
</div>

<script>
  // pywebview's Windows/WebView2 backend does not implement the standard
  // -webkit-app-region CSS at all (that's why the .drag/.no-drag classes'
  // CSS below has zero effect there) -- it drags frameless windows via its
  // own JS, keyed to the '.pywebview-drag-region' class (added to the
  // title bar above) walking UP from the click target through ancestors.
  // Without this, clicking a button inside that title bar (minimize, hide,
  // the update pill) would also register as a drag-start the moment the
  // mouse moves even slightly mid-click. Stopping propagation here at the
  // .no-drag boundary keeps the click from ever reaching that ancestor walk.
  document.querySelectorAll('.no-drag').forEach((el) => {
    el.addEventListener('mousedown', (e) => e.stopPropagation());
  });

  const transcriptEl = document.getElementById('transcript');
  const startedAt = Date.now();
  let muted = false;
  let listening = false;

  function pad(n) { return String(n).padStart(2, '0'); }
  function tickUptime() {
    const s = Math.floor((Date.now() - startedAt) / 1000);
    document.getElementById('tel-uptime').textContent =
      'UPTIME ' + pad(Math.floor(s/3600)) + ':' + pad(Math.floor((s%3600)/60)) + ':' + pad(s%60);
  }
  setInterval(tickUptime, 1000);

  function escapeHtml(s) {
    return (s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function scrollToBottom() { transcriptEl.scrollTop = transcriptEl.scrollHeight; }

  // Called from Python (and locally) to add a turn to the transcript.
  // role: "user" | "jarvis" | "system"; tools: optional array of tool-call name strings.
  function appendMessage(role, text, tools) {
    const row = document.createElement('div');
    if (role === 'user') {
      row.style.cssText = 'display:flex; justify-content:flex-end;';
      row.innerHTML = `<div style="background:rgba(111,227,255,0.10); border:1px solid rgba(111,227,255,0.28); padding:12px 16px; border-radius:14px 2px 14px 14px; font-size:14px; line-height:1.55; color:#EAF6FC; max-width:520px;">${escapeHtml(text)}</div>`;
    } else if (role === 'jarvis') {
      const toolsHtml = (tools && tools.length)
        ? `<div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;">${tools.map(t => `<div style="font-family:'JetBrains Mono',monospace; font-size:10px; color:#5E9BB8; background:rgba(111,227,255,0.06); border:1px solid rgba(111,227,255,0.18); padding:3px 9px; border-radius:5px;">${escapeHtml(t)}</div>`).join('')}</div>`
        : '';
      row.style.cssText = 'display:flex; align-items:flex-start; gap:12px; max-width:640px;';
      row.innerHTML = `
        <div style="width:28px; height:28px; min-width:28px; border-radius:50%; border:1px solid rgba(111,227,255,0.35); background:rgba(111,227,255,0.08); display:flex; align-items:center; justify-content:center;">
          <div style="width:8px; height:8px; border-radius:50%; background:oklch(78% 0.14 200); box-shadow:0 0 10px oklch(78% 0.14 200);"></div>
        </div>
        <div style="display:flex; flex-direction:column; gap:8px;">
          <div style="background:#0A0F16; border:1px solid rgba(120,190,255,0.14); padding:12px 16px; border-radius:2px 14px 14px 14px; font-size:14px; line-height:1.55; color:#D7E2EA;">${escapeHtml(text)}</div>
          ${toolsHtml}
        </div>`;
    } else {
      row.style.cssText = 'display:flex; justify-content:center;';
      row.innerHTML = `<div style="font-family:'JetBrains Mono',monospace; font-size:11px; color:#E3A34A; background:rgba(227,163,74,0.08); border:1px solid rgba(227,163,74,0.25); padding:6px 14px; border-radius:8px;">${escapeHtml(text)}</div>`;
    }
    transcriptEl.appendChild(row);
    scrollToBottom();
  }

  // status: {mic: "ARMED"|"MUTED", listening: bool, statusLine: str}
  function setStatus(status) {
    if (status.mic) {
      document.getElementById('tel-mic').textContent = status.mic;
      document.getElementById('mic-label').textContent = 'MIC ' + status.mic;
    }
    if (typeof status.listening === 'boolean') {
      listening = status.listening;
      const bars = document.querySelectorAll('#mic-bars > div');
      bars.forEach(b => b.style.animationName = listening ? 'jv-bar-active' : 'jv-bar');
      document.getElementById('orb-core').style.boxShadow = listening
        ? '0 0 44px rgba(111,227,255,0.85)'
        : '0 0 28px rgba(111,227,255,0.45)';
    }
    if (status.statusLine) document.getElementById('status-line').textContent = status.statusLine;
  }

  function setModel(model) {
    document.getElementById('model-label').textContent = model;
    document.getElementById('tel-model').textContent = model;
  }

  function setConnections(list) {
    const el = document.getElementById('tel-connections');
    el.innerHTML = list.map(name => `
      <div style="display:flex; align-items:center; gap:8px;">
        <div style="width:6px; height:6px; border-radius:50%; background:oklch(78% 0.14 200); box-shadow:0 0 6px oklch(78% 0.14 200);"></div>
        <span style="font-size:12px; color:#D7E2EA;">${escapeHtml(name)}</span>
      </div>`).join('');
  }

  function setTools(list) {
    const el = document.getElementById('tel-tools');
    el.innerHTML = list.slice(-6).reverse().map(t => `<div>${escapeHtml(t)}</div>`).join('')
      || '<div style="color:#4A5A6A;">none yet</div>';
  }

  function setMuted(isMuted) {
    muted = isMuted;
    document.getElementById('mute-slash').style.display = isMuted ? '' : 'none';
  }

  async function loadInitialState() {
    try {
      const state = await window.pywebview.api.get_state();
      (state.messages || []).forEach(m => appendMessage(m.role, m.text, m.tools));
      setModel(state.model || '');
      setConnections(state.connections || []);
      setTools(state.recent_tools || []);
      setMuted(!!state.muted);
      document.getElementById('app-version').textContent = state.version ? 'v' + state.version : '';
    } catch (e) {
      appendMessage('system', 'Could not load initial state: ' + e);
    }

    try {
      setUpdateStatus(await window.pywebview.api.get_update_status());
    } catch (e) {
      // Non-fatal -- the update pill just stays hidden.
    }
  }

  function setUpdateStatus(status) {
    const pill = document.getElementById('update-pill');
    status = status || { state: 'idle' };
    pill.className = 'no-drag';
    pill.onclick = null;

    switch (status.state) {
      case 'unsupported':
        pill.style.display = 'none';
        return;
      case 'idle':
      case 'not-available':
        pill.innerHTML = status.state === 'not-available' ? "You're up to date" : 'Check for Updates';
        pill.onclick = () => window.pywebview.api.check_for_updates();
        break;
      case 'checking':
        pill.innerHTML = '<span class="update-spinner"></span> Checking for updates&hellip;';
        break;
      case 'available':
        pill.innerHTML = `<span class="update-spinner"></span> Update ${status.version} found&hellip;`;
        break;
      case 'downloading':
        pill.className = 'no-drag accent';
        pill.innerHTML = `<span class="update-spinner"></span> Downloading update&hellip; ${Math.round(status.percent || 0)}%`;
        break;
      case 'downloaded':
        pill.className = 'no-drag success';
        pill.innerHTML = `Update ${status.version} ready &mdash; Restart &amp; Install`;
        pill.onclick = () => window.pywebview.api.install_update();
        break;
      case 'error':
        pill.className = 'no-drag error';
        pill.innerHTML = 'Update check failed &mdash; Retry';
        pill.title = status.message || '';
        pill.onclick = () => window.pywebview.api.check_for_updates();
        break;
      default:
        pill.style.display = 'none';
        return;
    }
    pill.style.display = 'inline-flex';
  }

  async function sendCommand(text) {
    if (!text.trim()) return;
    appendMessage('user', text);
    setStatus({ statusLine: 'THINKING…' });
    try {
      const result = await window.pywebview.api.send_command(text);
      appendMessage('jarvis', result.reply, result.tools);
    } catch (e) {
      appendMessage('system', 'Error: ' + e);
    }
    setStatus({ statusLine: 'WAKE WORD · HEY JARVIS' });
  }

  document.getElementById('command-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const val = e.target.value;
      e.target.value = '';
      sendCommand(val);
    }
  });

  document.getElementById('orb').addEventListener('click', async () => {
    if (listening) return;
    setStatus({ listening: true, statusLine: 'LISTENING…' });
    try {
      const result = await window.pywebview.api.trigger_listen();
      if (result.heard) {
        appendMessage('user', result.heard);
        appendMessage('jarvis', result.reply, result.tools);
      } else {
        appendMessage('system', 'Heard nothing.');
      }
    } catch (e) {
      appendMessage('system', 'Error: ' + e);
    }
    setStatus({ listening: false, statusLine: 'WAKE WORD · HEY JARVIS' });
  });

  document.getElementById('mute-btn').addEventListener('click', async () => {
    const isMuted = await window.pywebview.api.toggle_mute();
    setMuted(isMuted);
  });

  function stopSpeaking() {
    window.pywebview.api.stop_speaking();
  }
  document.getElementById('stop-btn').addEventListener('click', stopSpeaking);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') stopSpeaking();
  });

  document.getElementById('settings-btn').addEventListener('click', () => {
    window.pywebview.api.open_settings();
  });

  document.getElementById('minimize-btn').addEventListener('click', () => {
    window.pywebview.api.minimize();
  });

  document.getElementById('hide-btn').addEventListener('click', () => {
    window.pywebview.api.hide_to_tray();
  });

  document.getElementById('quit-btn').addEventListener('click', () => {
    window.pywebview.api.quit();
  });

  window.addEventListener('pywebviewready', loadInitialState);
</script>
</body>
</html>
